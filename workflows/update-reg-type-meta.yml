name: Update RegType Meta

on:
  push:
    branches:
      - main
    paths:
      - reg_type.csv

permissions:
  contents: write

jobs:
  update-meta:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update reg_type_meta.json
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: main
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          repo = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH"]
          now = datetime.now(timezone.utc)

          meta = {
              "version": int(now.timestamp()),
              "updatedAt": now.isoformat().replace("+00:00", "Z"),
              "csvUrl": f"https://raw.githubusercontent.com/{repo}/{branch}/reg_type.csv"
          }

          with open("reg_type_meta.json", "w", encoding="utf-8") as f:
              json.dump(meta, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Commit meta update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reg_type_meta.json
          git diff --cached --quiet || git commit -m "Update reg_type metadata"
          git push
